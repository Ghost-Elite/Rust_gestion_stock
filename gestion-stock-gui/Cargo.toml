[package]
name = "gestion-stock-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
gestion-stock = { path = "../gestion-stock" }
eframe = "0.35"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot", "eframe"] }

[[bin]]
name = "stock-gui"
path = "src/main.rs"
